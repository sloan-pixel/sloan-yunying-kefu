# 推送 v 开头的标签（如 v1.0.1），或在 Actions 页面手动点「Run workflow」时：
# 自动在 GitHub 的 Mac 和 Windows 机器上打包，并发布到 Releases（版本号取自 package.json）
name: 打包并发布安装包

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --ignore-scripts
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg --arm64
          - os: windows-latest
            args: --win nsis zip -c.win.signAndEditExecutable=true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
      - name: 打包
        shell: bash
        run: |
          set -o pipefail
          build() { npx electron-builder "$@" --publish never 2>&1 | tee -a build.log; }
          ok=1
          build ${{ matrix.args }} || { sleep 10; build ${{ matrix.args }}; } || ok=0
          # Mac：Intel 版单独再打一次（两个架构同时挂载磁盘映像会冲突）
          if [ "$ok" = 1 ] && [ "${{ runner.os }}" = "macOS" ]; then build --mac dmg --x64 || { sleep 10; build --mac dmg --x64; } || ok=0; fi
          [ "$ok" = 1 ] || {
            echo "::error title=打包失败::$(grep -iE 'error|failed|⨯' build.log | tail -15 | tr '\n' ' ' | cut -c1-3000)"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: 附上离线使用说明和知识库模板
        run: cp docs/使用说明.html dist/user-guide-zh.html && cp samples/QA知识库模板.xlsx dist/qa-template.xlsx && cp samples/商品库模板.xlsx dist/product-template.xlsx
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sloan云盈客服助手 v${{ steps.v.outputs.version }}
          body_path: docs/release-notes.md
          files: dist/*
